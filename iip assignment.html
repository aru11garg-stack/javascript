<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal - Login</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="css/IIPassignment.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Student Portal</h1>
            <p class="subtitle">Login to access your student information</p>

            <form>

                <!-- Username -->
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    placeholder="Enter your username"
                >

                <!-- Password -->
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter your password"
                >

                <!-- Login Button -->
                <button type="submit">Login</button>

                <!-- Message Area -->
                <p id="message"></p>

            </form>

        </div>

    </div>
<script src="js/iip assignment1.js"></script>
</body>
</html>
