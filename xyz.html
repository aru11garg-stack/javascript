<!DOCTYPE html>
<html>

<head>
    <title>Using Div with CSS</title>
</head>

<body style="background-color: lightgray; font-family: Arial;">

    <div style="
        display: inline-block;
        background-color: white;
        width: 250px;
        padding: 20px;
        margin: 30px;
        border: 2px solid blue;
        border-radius: 10px;
        text-align: center;
    ">

        <h2 style="color: blue;">
            Web Development
        </h2>

        <p style="font-size: 18px;">
            Learn HTML, CSS and JavaScript
            to create beautiful websites.
        </p>

        <button style="
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        ">
            Learn More
        </button>

    </div>


    <div style="
        display: decline-block;
        background-color: rgb(250, 246, 246);
        width: 250px;
        padding: 20px;
        margin: 30px;
        border: 2px solid green;
        border-radius: 10px;
        text-align: center;
    ">

        <h2 style="color: green;">
            Programming
        </h2>

        <p style="font-size: 18px;">
            Learn programming concepts and
            develop problem-solving skills.
        </p>

        <button style="
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        ">
            Learn More
        </button>

    </div>

    <div style="
        display: decline-block;
        background-color: rgb(250, 246, 246);
        width: 250px;
        padding: 20px;
        margin: 30px;
        border: 2px solid red;
        border-radius: 10px;
        text-align: center;
    ">
    <h2 style="color: red;">
        Data Science
    </h2>   
    <p style="font-size: 18px;">
        Learn data analysis, machine learning,
        and data visualization techniques.
    </p>
    <button style="
        background-color: red;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
    ">
        Learn More
    </button>
    </div>

</body>

</html>
